<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Traffic Analyzer</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(120deg, #f5f7fa, #c3cfe2);
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    header {
      width: 100%;
      background-color: #2c3e50;
      color: white;
      padding: 1rem 0;
      text-align: center;
      font-size: 1.8rem;
      font-weight: bold;
    }

    .container {
      background: white;
      margin-top: 2rem;
      padding: 2rem;
      border-radius: 12px;
      width: 90%;
      max-width: 700px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
    }

    form {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    input[type="file"] {
      margin-bottom: 1rem;
      font-size: 1rem;
    }

    input[type="submit"] {
      padding: 0.7rem 2rem;
      font-size: 1.1rem;
      background-color: #2980b9;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: 0.3s ease;
    }

    input[type="submit"]:hover {
      background-color: #1abc9c;
    }

    .video-container {
      margin-top: 2rem;
      text-align: center;
    }

    video {
      width: 100%;
      max-width: 640px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.3);
    }

    .spinner {
      display: none;
      margin-top: 1.5rem;
      text-align: center;
    }

    .spinner div {
      width: 40px;
      height: 40px;
      margin: auto;
      border: 5px solid #ccc;
      border-top-color: #2980b9;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 600px) {
      header {
        font-size: 1.4rem;
      }

      input[type="submit"] {
        font-size: 1rem;
        padding: 0.6rem 1.5rem;
      }
    }
  </style>
</head>
<body>
  <header>🚦 AI Traffic Analyzer</header>

  <div class="container">
    <form method="POST" enctype="multipart/form-data" onsubmit="showSpinner()">
      <input type="file" name="video" accept="video/*" required />
      <input type="submit" value="Analyze Traffic" />
    </form>

    <div class="spinner" id="loadingSpinner">
      <div></div>
      <p style="margin-top: 0.5rem;">Processing video, please wait...</p>
    </div>

    {% if result_video %}
    <div class="video-container">
      <h2>Processed Output</h2>
      <video controls>
        <source src="{{ url_for('video', filename=result_video) }}" type="video/mp4">
        Your browser does not support the video tag.
      </video>
    </div>
    {% endif %}
  </div>

  <script>
    function showSpinner() {
      document.getElementById("loadingSpinner").style.display = "block";
    }
  </script>
</body>
</html>
